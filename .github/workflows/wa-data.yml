# Checks WDFW's emergency fishing rules and trout stocking report every 30 minutes,
# and commits data/wa-*.json when anything changed. The app reads those files.
# If a page can't be read the job fails (GitHub emails the repository owner) and
# the app shows "Couldn't verify – check WDFW" until the next good run.
name: Washington rules and stocking

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wa-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read WDFW pages
        id: run
        run: node scripts/wa-data.mjs
        continue-on-error: true
      - name: Commit changed data
        run: |
          git config user.name "fishamongus-data"
          git config user.email "fishamongus-data@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Washington rules and stocking data"
            git push
          fi
      - name: Report a failed check
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::The WDFW pages could not be read. The app is showing 'Couldn't verify' until the next good run."
          exit 1
