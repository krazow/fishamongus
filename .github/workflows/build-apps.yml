# Builds the Android app (APK) and the Windows installer from the web app in this repository.
# Both carry the map library, so maps work offline from the first launch.
# Signing: with the secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS set, the APK is
# signed here and published as a release. Without them, the unsigned APK is pushed to the `builds` branch to be signed.
name: Build Android and Windows apps
on:
  workflow_dispatch:
    inputs:
      check_signing:
        description: 'Only check signing: sign and verify the APK with the repository secrets, publish nothing'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['app.js', 'index.html', 'styles.css', 'sw.js', 'manifest.webmanifest', 'icons/**', 'android/**', 'windows/**', '.github/workflows/build-apps.yml', '.github/workflows/tests.yml', 'tests/**']
permissions:
  contents: write
concurrency:
  group: build-apps
  cancel-in-progress: true
jobs:
  tests:
    # Nothing is built or released unless every test suite passes.
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Version
        id: v
        run: echo "ver=$(grep -o "APP_VERSION = '[0-9.]*" app.js | grep -o '[0-9.]*$')" >> "$GITHUB_OUTPUT"
      - name: Map library (Leaflet 1.9.4)
        run: |
          mkdir -p /tmp/leaflet && cd /tmp/leaflet && npm pack leaflet@1.9.4 --silent && tar xzf leaflet-1.9.4.tgz
          ls /tmp/leaflet/package/dist
      - name: Android web files
        run: |
          W=android/app/src/main/assets/www
          rm -rf "$W" && mkdir -p "$W/icons" "$W/vendor/leaflet"
          cp index.html app.js styles.css sw.js manifest.webmanifest "$W"/
          cp icons/* "$W/icons/"
          cp -r /tmp/leaflet/package/dist/* "$W/vendor/leaflet/"
          sed -i "s#https://unpkg.com/leaflet@1.9.4/dist/#vendor/leaflet/#" "$W/app.js"
          grep -c "vendor/leaflet/" "$W/app.js"
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee /tmp/build.log
      - name: Align (and sign when the key is set up)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT: 941c7276419e8e131db99bba49564556e2f5cc8953df7985171a5a893b3c3335
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/Fishamongus-${{ steps.v.outputs.ver }}-unsigned.apk"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/ks.p12
            "$BT/apksigner" sign --ks /tmp/ks.p12 --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out "dist/Fishamongus-${{ steps.v.outputs.ver }}.apk" "dist/Fishamongus-${{ steps.v.outputs.ver }}-unsigned.apk"
            "$BT/apksigner" verify --verbose --print-certs "dist/Fishamongus-${{ steps.v.outputs.ver }}.apk" | tee /tmp/verify.txt
            # Must be the key that signed every release so far, or the APK won't install over people's current app.
            grep -qi "certificate SHA-256 digest: $EXPECTED_CERT" /tmp/verify.txt || { echo "::error::The APK was signed with a different key than earlier releases. Check the ANDROID_KEYSTORE_B64 secret."; exit 1; }
            rm "dist/Fishamongus-${{ steps.v.outputs.ver }}-unsigned.apk" /tmp/ks.p12
          elif [ "${{ inputs.check_signing }}" = "true" ]; then
            echo "::error::The signing secrets aren't set: ANDROID_KEYSTORE_B64 is empty."; exit 1
          fi
          ls -la dist
      - name: Diagnose the signing secrets (check only; never prints them)
        if: ${{ always() && inputs.check_signing }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          r=/tmp/signing-diag.txt; : > $r
          say() { echo "$1" | tee -a $r; }
          say "ANDROID_KEYSTORE_B64: ${#KS_B64} characters (expected 4560)"
          clean=$(printf '%s' "$KS_B64" | tr -d ' \r\n\t')
          say "  after removing spaces and line breaks: ${#clean} characters"
          case "$KS_B64" in ANDROID*|*" = "*) say "  starts with a name or contains ' = ': only the value should be pasted";; esac
          if printf '%s' "$clean" | base64 -d > /tmp/k.p12 2>/dev/null; then say "  decodes: yes, $(stat -c%s /tmp/k.p12) bytes (expected 3418)"; else say "  decodes: NO (not valid base64)"; fi
          sum=$(sha256sum /tmp/k.p12 | cut -c1-64); [ "$sum" = 04b8a54f2374744328159dd1ce8766bc555fd9354377dc530cf33992ffb266c8 ] && say "  same key file as 4.9.3: yes" || say "  same key file as 4.9.3: NO"
          say "ANDROID_KEYSTORE_PASSWORD: ${#KS_PASS} characters (expected 24)"
          if keytool -list -keystore /tmp/k.p12 -storetype PKCS12 -storepass:env KS_PASS > /tmp/kl.txt 2>&1; then say "  opens the key file: yes"; else say "  opens the key file: NO ($(grep -o 'password was incorrect\|keystore password was incorrect\|Invalid keystore format' /tmp/kl.txt | head -1))"; fi
          say "ANDROID_KEY_ALIAS: ${#KS_ALIAS} characters (expected 11)"
          if grep -qi "^${KS_ALIAS}," /tmp/kl.txt; then say "  found in the key file: yes"; else say "  found in the key file: NO (aliases in the file: $(grep -c 'PrivateKeyEntry' /tmp/kl.txt))"; fi
          rm -f /tmp/k.p12 /tmp/kl.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash -q 2>/dev/null || true
          git checkout -q --orphan diag-new && git rm -rfq . && git clean -fdq
          cp $r signing-diag.txt && git add signing-diag.txt && git commit -qm "Signing diagnosis for ${GITHUB_SHA::7}" && git push -qf origin diag-new:signing-diag
      - name: Windows installer
        run: |
          set -o pipefail
          LEAFLET_DIR=/tmp/leaflet/package/dist sh windows/build.sh 2>&1 | tee -a /tmp/build.log
          cp windows/dist/FishamongusSetup-*.exe dist/
      - name: Signing check result
        if: ${{ inputs.check_signing }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/verify.txt /tmp/signing-check.txt; ls -la dist >> /tmp/signing-check.txt
          git checkout --orphan check-new && git rm -rfq . && git clean -fdq
          cp /tmp/signing-check.txt signing-check.txt && git add signing-check.txt && git commit -qm "Signing check passed for ${GITHUB_SHA::7}"
          git push -f origin check-new:signing-check
      - name: Release (signed builds)
        if: ${{ !inputs.check_signing && hashFiles('dist/Fishamongus-*[0-9].apk') != '' }}
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=${{ steps.v.outputs.ver }}
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" dist/Fishamongus-$V.apk dist/FishamongusSetup-$V.exe --target "$GITHUB_SHA" --title "Fishamongus! $V" --notes-file android/RELEASE_NOTES.md
      - name: Push unsigned build to the builds branch
        if: ${{ !inputs.check_signing && hashFiles('dist/Fishamongus-*-unsigned.apk') != '' }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/b/unsigned /tmp/b/.github/workflows && cp dist/* /tmp/b/unsigned/ && cp android/RELEASE_NOTES.md /tmp/b/
          cp .github/workflows/release-apk.yml /tmp/b/.github/workflows/
          git checkout --orphan builds-new && git rm -rfq . && git clean -fdq
          cp -r /tmp/b/. . && git add -A && git commit -qm "Unsigned build ${{ steps.v.outputs.ver }} from ${GITHUB_SHA::7}"
          git push -f origin builds-new:builds
      # Build logs can't be read from outside GitHub here, so a failed build leaves its log on the build-logs branch.
      - name: Save the log when the build fails
        if: failure()
        run: |
          cp /tmp/build.log /tmp/fail.log 2>/dev/null || echo "no log" > /tmp/fail.log
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan logs-new && git rm -rfq . && git clean -fdq
          tail -c 200000 /tmp/fail.log > build.log && git add build.log && git commit -qm "Failed build log ${GITHUB_SHA::7}" && git push -f origin logs-new:build-logs
