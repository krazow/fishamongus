# When a signed APK is pushed to the `builds` branch (signed/), check its signature with Google's apksigner and,
# if it verifies, publish it with the Windows installer as a GitHub release. The check result is saved as verify.txt.
name: Verify and release signed APK
on:
  push:
    branches: [builds]
    paths: ['signed/**']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: builds }
      - name: Verify
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls signed/Fishamongus-*.apk | head -1)
          set +e
          "$BT/apksigner" verify --verbose --print-certs "$APK" > verify.txt 2>&1; ok=$?
          "$BT/aapt2" dump badging "$APK" | head -5 >> verify.txt 2>&1
          echo "exit=$ok" >> verify.txt
          cat verify.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify.txt && git commit -qm "apksigner verify: exit $ok" && git push -q origin HEAD:builds
          exit $ok
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          APK=$(ls signed/Fishamongus-*.apk | head -1); V=$(basename "$APK" .apk | sed 's/Fishamongus-//')
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" "$APK" unsigned/FishamongusSetup-$V.exe --target main --title "Fishamongus! $V" --notes-file RELEASE_NOTES.md
