plugins { id 'com.android.application' }

// The version comes from APP_VERSION in app.js, e.g. 4.9.1 → versionCode 40901.
def appVersion = (file('../../app.js').text =~ /APP_VERSION = '([0-9.]+)/)[0][1]
def parts = (appVersion.tokenize('.') + ['0', '0']).take(3).collect { it as int }

android {
    namespace 'com.krazow.fishamongus'
    compileSdk 35
    defaultConfig {
        applicationId 'com.krazow.fishamongus'
        minSdk 24
        targetSdk 34
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName appVersion
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The web files go in uncompressed-friendly as assets; nothing to strip.
    androidResources { noCompress += ['webmanifest'] }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
