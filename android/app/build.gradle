plugins { id 'com.android.application' }

// The version comes from APP_VERSION in app.js, e.g. 4.9.1 → versionCode 40901.
// android/build-release.sh (run by the release kit) passes -PversionName, -Pbeta and -PwebDir.
def webDir = project.hasProperty('webDir') ? project.property('webDir').toString() : '../..'
def appVersion = project.hasProperty('versionName') ? project.property('versionName').toString()
    : (file("$webDir/app.js").text =~ /APP_VERSION = '([0-9.]+)/)[0][1]
def parts = (appVersion.tokenize('-')[0].tokenize('.') + ['0', '0']).take(3).collect { it as int }
def beta = project.hasProperty('beta') && project.property('beta').toString() == 'true'

android {
    namespace 'com.krazow.fishamongus'
    compileSdk 35
    defaultConfig {
        applicationId 'com.krazow.fishamongus'
        minSdk 24
        targetSdk 34
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName appVersion
        // The beta installs beside the real app, with its own log.
        if (beta) applicationIdSuffix '.beta'
        manifestPlaceholders = [appLabel: beta ? 'Fishamongus! Beta' : 'Fishamongus!']
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The web files go in uncompressed-friendly as assets; nothing to strip.
    androidResources { noCompress += ['webmanifest'] }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
